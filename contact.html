<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer">
  <title>Contact Us – TheMaskMan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <script>
    (function() {
      if (localStorage.getItem('tmm_dark') !== 'false') {
        document.body.classList.add('dark');
      }
    })();
  </script>

  <!-- ── FLOATING STICKY PILL ── -->
  <div class="sticky-pill" id="stickyPill" aria-hidden="true">
    <a href="index.html" class="sp-logo"><img src="maskmannn.png" alt="Logo" width="24" height="24"></a>
    <button class="sp-saved" id="spSavedBtn" aria-label="Saved Items"><svg viewBox="0 0 24 24" fill="none" width="16"><path d="M4.3 4.3a5.9 5.9 0 018.4 0l1.3 1.3 1.3-1.3a5.9 5.9 0 018.4 8.4l-9.7 9.7-9.7-9.7a5.9 5.9 0 010-8.4z" stroke="currentColor" stroke-width="1.8"/></svg><span class="sp-badge" id="spSavedBadge"></span></button>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-icon"><img src="maskmannn.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 4px;"></span><span class="logo-text">TheMaskMan</span></a>
      <button class="header-search-btn" id="searchTriggerBtn"><span class="search-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="search-placeholder">Search...</span><kbd>⌘K</kbd></button>
      <nav class="desktop-nav" id="desktopNav">
        <div class="nav-indicator" id="navIndicator"></div>
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#deals-section" class="nav-link">Top Deals</a>
      </nav>
      <button class="mode-toggle" id="modeToggle"><svg class="theme-morph-svg" viewBox="0 0 24 24" fill="none" width="18"><circle class="sun-moon-core" cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/><g class="sun-rays" stroke="currentColor"><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></g><path class="moon-mask" d="M16 12A4 4 0 0012 8" stroke="currentColor" stroke-width="1.8" opacity="0"/></svg></button>
      <div class="header-account" id="headerAccount">
        <button class="account-toggle" id="accountToggle"><span class="account-label" id="accountLabel">Guest</span></button>
        <div class="account-dropdown" id="accountDropdown"><a href="user_login.html" class="account-item">Log In</a></div>
      </div>
    </div>
    <div class="header-ticker" id="headerTicker"><div class="ticker-track"><span>Need help? Contact our support team today.</span></div></div>
  </header>

  <div class="breadcrumb-bar" id="breadcrumbBar">
    <div class="breadcrumb-inner"><a href="index.html">Home</a><span class="bc-sep">◆</span><span class="bc-item">Contact Us</span></div>
  </div>

  <main>
    <style>
    .contact-form { background: var(--bg-card); padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border); max-width: 600px; margin: 0 auto;}
    .form-group { margin-bottom: 24px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
    .form-group input, .form-group textarea { width: 100%; border: 1px solid var(--border); background: var(--bg-card-2); color: var(--text); padding: 12px 16px; border-radius: var(--radius-sm); outline: none; transition: 0.3s ease; font-family: var(--font-body); }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
    </style>
    <section class="page-header" style="padding: 120px 24px 60px; max-width: 1280px; margin: 0 auto; text-align: center;">
      <h1 class="hero-title">Contact Us</h1>
      <p class="hero-subtitle" style="margin:0 auto">Reach out for business inquiries or support.</p>
    </section>
    <section class="page-content" style="padding: 0 24px 80px; max-width: 800px; margin: 0 auto; font-size: 15px; color: var(--text-muted); line-height: 1.8;">
      <div class="contact-form">
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Jane Doe" id="contactName" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="jane@example.com" id="contactEmail" />
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="How can we help you?" id="contactMsg"></textarea>
        </div>
        <button class="btn-primary" style="width:100%; justify-content:center;" onclick="alert('Message Sent!')">Send Message</button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><span class="logo-text">TheMaskMan</span></div></footer>

  <script src="index.js"></script>
</body>
</html>
